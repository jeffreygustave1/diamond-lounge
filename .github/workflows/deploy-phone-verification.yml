name: Deploy Diamond Lounge Phone Verification Worker

on:
  push:
    branches: [main]
    paths:
      - "phone-verification/**"
      - ".github/workflows/deploy-phone-verification.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: phone-verification
          command: deploy
