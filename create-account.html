
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101114">
    <title>Create an account | Diamond Lounge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=7">
    <link rel="stylesheet" href="brand.css?v=7">
</head>
<body class="auth-page">
    <main class="login-container">
        <a class="auth-brand" href="index.html"><img src="diamond.gif" alt="" class="auth-brand-gem"> DIAMOND LOUNGE</a>
        <h1>Make yourself at home</h1>
        <p class="login-subtitle">Create your place in the lounge.</p>

        <form id="createAccountForm" class="login-form">
            <label for="username">Display name</label>
            <input type="text" id="username" name="username" placeholder="How should we call you?" autocomplete="nickname" required minlength="3" maxlength="30">

            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 6 characters" autocomplete="new-password" required minlength="6">

            <button type="submit" class="login-button" id="createButton">Create account</button><button type="button" class="login-button" id="googleSignupButton">Continue with Google</button>
            <p id="errorMessage" role="alert" aria-live="polite"></p>
        </form>

        <p class="signup-link">Already a member? <a href="login.html">Sign in</a></p>
        <a class="back-home" href="index.html">← Back to Diamond Lounge</a>
    </main>

    <script type="module">
        import { auth, db } from "./firebase.js";
        import {
            createUserWithEmailAndPassword,
            updateProfile, GoogleAuthProvider, signInWithPopup
        } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
        import {
            doc, getDoc,
            setDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

        const form = document.getElementById("createAccountForm");
        const button = document.getElementById("createButton");
        const errorMessage = document.getElementById("errorMessage");

        const requestedRedirect = new URLSearchParams(window.location.search).get("redirect");

        function postAuthDestination() {
            if (!requestedRedirect) return "dashboard.html";
            try {
                const target = new URL(requestedRedirect, window.location.origin);
                const appBasePath = new URL("./", window.location.href).pathname;
                if (target.origin !== window.location.origin ||
                    !target.pathname.startsWith(appBasePath)) {
                    return "dashboard.html";
                }
                return target.pathname + target.search + target.hash;
            } catch {
                return "dashboard.html";
            }
        }

        const signInLink = document.querySelector(".signup-link a");
        if (requestedRedirect && signInLink) {
            const loginUrl = new URL(signInLink.href);
            loginUrl.searchParams.set("redirect", requestedRedirect);
            signInLink.href = loginUrl.toString();
        }

        const errors = {
            "auth/email-already-in-use": "This email already has an account. Try signing in instead.",
            "auth/invalid-email": "Please enter a valid email address.",
            "auth/weak-password": "Choose a password with at least 6 characters.",
            "auth/network-request-failed": "Network error. Check your connection and try again.",
            "auth/operation-not-allowed": "Enable Email/Password sign-in in Firebase Authentication.",
            "auth/unauthorized-domain": "Add jeffreygustave1.github.io under Firebase Authentication → Settings → Authorized domains.",
            "auth/invalid-api-key": "The Firebase API key in firebase.js is invalid. Copy the Web app config from Firebase Console.",
            "auth/popup-blocked": "The Google sign-in popup was blocked. Allow popups for Diamond Lounge and try again.",
            "auth/popup-closed-by-user": "Google sign-in was closed before completion.",
            "auth/account-exists-with-different-credential": "An account already exists with this email using another sign-in method. Sign in using that method, then link Google from your profile."
        };

        document.getElementById("googleSignupButton").addEventListener("click", async () => {
          try {
            const result = await signInWithPopup(auth, new GoogleAuthProvider());
            const profileRef=doc(db,"users",result.user.uid); const existing=await getDoc(profileRef); if(!existing.exists()){await setDoc(profileRef,{uid:result.user.uid,displayName:result.user.displayName || "Member",createdAt:serverTimestamp()});}
            window.location.assign(postAuthDestination());
          } catch(e) { errorMessage.textContent = errors[e.code] || e.message; }
        });
        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            if (!form.reportValidity()) return;

            errorMessage.textContent = "";
            button.disabled = true;
            button.textContent = "Creating your account…";

            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (username.length < 3 || username.length > 30) {
                errorMessage.textContent = "Display name must be between 3 and 30 characters.";
                button.disabled = false;
                button.textContent = "Create account";
                return;
            }

            try {
                const credential = await createUserWithEmailAndPassword(auth, email, password);
                const user = credential.user;

                await updateProfile(user, { displayName: username });

                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    displayName: username,
                    createdAt: serverTimestamp()
                });

                window.location.assign(postAuthDestination());

            } catch (error) {
                console.error("Account creation error:", error);

                if (auth.currentUser) {
                    errorMessage.textContent = "Your account was created, but your member profile could not be saved. Please contact the lounge administrator before creating another account.";
                } else {
                    errorMessage.textContent = errors[error.code] || `Account creation failed${error.code ? ` (${error.code})` : ". Check your connection and try again."}`;
                }

                button.disabled = false;
                button.textContent = "Create account";
            }
        });
    </script>
</body>
</html>
