<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Lounge Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard">

    <div class="servers">

        <div class="server-logo">💎</div>

        <div class="server-icon">🎮</div>
        <div class="server-icon">🎵</div>
        <div class="server-icon">🎬</div>
        <div class="server-icon">🏆</div>
        <div class="server-icon">➕</div>

    </div>

    <div class="channels">

        <h3>CHANNELS</h3>

        <ul>

            <li># general <span class="badge">3</span></li>
            <li># gaming <span class="badge">12</span></li>
            <li># streaming <span class="badge">2</span></li>
            <li># announcements</li>

        </ul>

        <div class="profile-card">

            <div
                class="profile-name"
                id="profileName">

                💎 Member

            </div>

            <div class="profile-status">

                🟢 Online

            </div>

            <div class="profile-actions">

                ⚙️ Settings

            </div>

        </div>

    </div>

    <div class="chat-area">

        <div class="chat-header">

            💎 Diamond Lounge

            <div class="sub-header">

                Premium Community Platform

            </div>

            <button
                class="clear-btn"
                onclick="clearChat()">

                Clear Chat

            </button>

        </div>

        <div
            class="messages"
            id="messages">

            <div class="message">

                <strong>System:</strong>
                Welcome to Diamond Lounge 💎

            </div>

        </div>

        <div class="message-box">

            <input
                type="text"
                id="messageInput"
                placeholder="Send a message..." />

            <button onclick="sendMessage()">

                Send

            </button>

        </div>

    </div>

    <div class="members">

        <h3>ONLINE</h3>

        <ul id="onlineMembers">

            <li id="currentUser">
                🟢 Member
            </li>

            <li>🟢 Gamer01</li>
            <li>🟡 MusicFan</li>
            <li>🔴 Streamer</li>

        </ul>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
