<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Link sign-in methods | Diamond Lounge</title><link rel="stylesheet" href="style.css?v=7"><link rel="stylesheet" href="brand.css?v=7"><style>.method{padding:14px;border:1px solid #7775;border-radius:12px;margin:12px 0}input{box-sizing:border-box;width:100%;padding:12px;margin:8px 0}button{padding:12px;cursor:pointer}.status{min-height:24px}</style></head><body class="auth-page"><main class="login-container"><a class="auth-brand" href="index.html">💎 DIAMOND LOUNGE</a><h1>Connect sign-in methods</h1><p>Connect methods to the currently signed-in account.</p><div id="status" role="status" aria-live="polite"></div><div id="account"></div><section class="method"><h3>Google</h3><button id="google">Link Google account</button></section><section class="method"><h3>Email and password</h3><form id="emailForm"><input type="email" id="email" placeholder="Email address" required><input type="password" id="password" placeholder="Password (6+ characters)" minlength="6" required><button>Link email/password</button></form></section><section class="method"><h3>Phone</h3><input id="phone" type="tel" placeholder="+1 555 123 4567"><button id="send">Send verification SMS</button><div id="recaptcha-container"></div><input id="code" inputmode="numeric" placeholder="SMS code" hidden><button id="verify" hidden>Verify and link</button></section><p>If a method is already attached to another account, this won't merge accounts or move messages.</p><a href="dashboard.html">Return to Diamond Lounge</a></main><script type="module">
import {auth} from "./firebase.js";import {onAuthStateChanged,GoogleAuthProvider,linkWithPopup,EmailAuthProvider,linkWithCredential,RecaptchaVerifier,linkWithPhoneNumber} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
const status=document.getElementById("status");let user=null,confirmation=null,recaptcha=null;function show(e){status.textContent=["auth/credential-already-in-use","auth/email-already-in-use","auth/phone-number-already-exists"].includes(e.code)?"This sign-in method belongs to another account; automatic merging isn't supported.":e.code==="auth/provider-already-linked"?"Already linked.":e.code==="auth/operation-not-allowed"?"Enable the sign-in provider in Firebase Authentication.":e.message||"Something went wrong."}
onAuthStateChanged(auth,u=>{user=u;if(!u){status.textContent="Sign in first. Redirecting…";location.href="login.html?redirect=account-linking.html";return;}document.getElementById("account").textContent="Signed in: "+(u.email||u.phoneNumber||u.displayName||"Member")});
document.getElementById("google").onclick=async()=>{try{await linkWithPopup(user,new GoogleAuthProvider());status.textContent="Google linked successfully."}catch(e){show(e)}};
document.getElementById("emailForm").onsubmit=async e=>{e.preventDefault();try{await linkWithCredential(user,EmailAuthProvider.credential(document.getElementById("email").value.trim(),document.getElementById("password").value));status.textContent="Email/password linked."}catch(e){show(e)}};
document.getElementById("send").onclick=async()=>{try{if(recaptcha)recaptcha.clear();recaptcha=new RecaptchaVerifier(auth,"recaptcha-container",{size:"normal"});confirmation=await linkWithPhoneNumber(user,document.getElementById("phone").value.trim(),recaptcha);document.getElementById("code").hidden=false;document.getElementById("verify").hidden=false;status.textContent="Code sent."}catch(e){show(e)}};
document.getElementById("verify").onclick=async()=>{try{await confirmation.confirm(document.getElementById("code").value.trim());status.textContent="Phone linked successfully."}catch(e){show(e)}};
</script></body></html>
