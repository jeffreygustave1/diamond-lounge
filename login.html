<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Lounge Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-container">
        <img src="diamond.gif" alt="Diamond Logo" class="login-logo">
        <h1>Welcome Back</h1>
        <p class="login-subtitle">Sign into Diamond Lounge</p>

        <form id="loginForm" class="login-form">
            <input
                type="email"
                id="loginEmail"
                placeholder="Email Address"
                autocomplete="email"
                required>

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                autocomplete="current-password"
                required>

            <button type="submit" class="login-button" id="loginButton">
                Login
            </button>
            <p id="errorMessage" role="alert" aria-live="polite"></p>
        </form>

        <p class="signup-link">
            Don't have an account?
            <a href="create-account.html">Create One</a>
        </p>
    </main>

    <script type="module">
        import { auth } from "./firebase.js";
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

        const form = document.getElementById("loginForm");
        const button = document.getElementById("loginButton");
        const errorMessage = document.getElementById("errorMessage");

        const errors = {
            "auth/invalid-credential": "Incorrect email or password.",
            "auth/user-not-found": "No account was found with this email.",
            "auth/wrong-password": "Incorrect email or password.",
            "auth/invalid-email": "Please enter a valid email address.",
            "auth/user-disabled": "This account has been disabled. Contact support.",
            "auth/too-many-requests": "Too many attempts. Please try again later.",
            "auth/network-request-failed": "Network error. Check your internet connection and try again.",
            "auth/operation-not-allowed": "Email/password sign-in is not enabled for this Firebase project.",
            "auth/unauthorized-domain": "This website domain is not authorized in Firebase Authentication settings."
        };

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            errorMessage.textContent = "";
            button.disabled = true;
            button.textContent = "Signing In...";

            try {
                const email = document.getElementById("loginEmail").value.trim();
                const password = document.getElementById("loginPassword").value;
                await signInWithEmailAndPassword(auth, email, password);
                window.location.assign("dashboard.html");
            } catch (error) {
                console.error("Login error:", error);
                errorMessage.textContent = errors[error.code] || "Login failed. Please check your details and try again.";
                button.disabled = false;
                button.textContent = "Login";
            }
        });
    </script>
</body>
</html>
