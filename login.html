<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diamond Lounge Login</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-container">

<img src="diamond.gif" alt="Diamond Logo" class="login-logo">

<h1>Welcome Back</h1>

<p class="login-subtitle">
Sign into Diamond Lounge
</p>

<form class="login-form">

<input
type="email"
placeholder="Email Address"
required>

<input
type="password"
placeholder="Password"
required>

<a href="dashboard.html" class="login-button">
Login
</a>

</form>

<p class="signup-link">

Don't have an account?

<a href="#">
Create One
</a>

</p>

</div>

</body>

</html>
