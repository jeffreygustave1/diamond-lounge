<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101114">
    <title>Sign in | DIAMOND LOUNGE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=7">
    <link rel="stylesheet" href="brand.css?v=7">
</head>
<body class="auth-page">
    <main class="login-container">
        <a class="auth-brand" href="index.html"><img src="diamond.gif" alt="" class="auth-brand-gem"> DIAMOND LOUNGE</a>
        <h1>Welcome back</h1>
        <p class="login-subtitle">Your lounge is waiting.</p>
        <form id="loginForm" class="login-form" method="post" action="login.html">
            <label for="loginEmail">Email address (username sign-in not enabled yet)</label>
            <input type="text" id="loginEmail" name="email" placeholder="Email address" autocomplete="username" required>
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" name="password" placeholder="Your password" autocomplete="current-password" required>
            <button type="submit" class="login-button" id="loginButton">Sign in</button>
<button type="button" class="login-button" id="googleButton">Continue with Google</button>
<button type="button" class="login-button" id="guestButton">Browse as Guest</button>
<p>Or sign in with phone</p><label for="phoneNumber">Phone number</label><input type="tel" id="phoneNumber" placeholder="+1 555 123 4567" autocomplete="tel"><button type="button" class="login-button" id="phoneButton">Send verification code</button>
<div id="phoneCodeArea" hidden><label for="phoneCode">SMS verification code</label><input id="phoneCode" inputmode="numeric" autocomplete="one-time-code"><button type="button" class="login-button" id="verifyPhoneButton">Verify code</button></div><div id="recaptcha-container"></div>
            <p id="errorMessage" role="alert" aria-live="polite"></p>
        </form>
        <p class="signup-link">New to the lounge? <a href="create-account.html">Create an account</a></p>
        <a class="back-home" href="index.html">← Back to DIAMOND LOUNGE</a>
    </main>
    <script type="module">
        import { auth, db } from "./firebase.js";
        import { signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, RecaptchaVerifier, signInWithPhoneNumber, signInAnonymously } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

        const form = document.getElementById("loginForm");
        const button = document.getElementById("loginButton");
        const errorMessage = document.getElementById("errorMessage");
        const googleButton = document.getElementById("googleButton");
const guestButton=document.getElementById("guestButton");
const phoneButton = document.getElementById("phoneButton");
const phoneCodeArea = document.getElementById("phoneCodeArea");
const requestedRedirect = new URLSearchParams(window.location.search).get("redirect");

        function postAuthDestination() {
            if (!requestedRedirect) return "dashboard.html";
            try {
                const target = new URL(requestedRedirect, window.location.origin);
                const appBasePath = new URL("./", window.location.href).pathname;
                if (target.origin !== window.location.origin ||
                    !target.pathname.startsWith(appBasePath)) {
                    return "dashboard.html";
                }
                return target.pathname + target.search + target.hash;
            } catch {
                return "dashboard.html";
            }
        }

        const createAccountLink = document.querySelector(".signup-link a");
        if (requestedRedirect && createAccountLink) {
            const accountUrl = new URL(createAccountLink.href);
            accountUrl.searchParams.set("redirect", requestedRedirect);
            createAccountLink.href = accountUrl.toString();
        }

        const errors = {
            "auth/invalid-credential": "Incorrect email or password.",
            "auth/user-not-found": "No account was found with this email.",
            "auth/wrong-password": "Incorrect email or password.",
            "auth/invalid-email": "Please enter a valid email address.",
            "auth/user-disabled": "This account has been disabled. Contact support.",
            "auth/too-many-requests": "Too many attempts. Please try again later.",
            "auth/network-request-failed": "Network error. Check your connection and try again.",
            "auth/operation-not-allowed": "Enable Email/Password sign-in in Firebase Authentication.",
            "auth/unauthorized-domain": "This site is not authorized for Firebase sign-in yet. Add diamond-lounge.pages.dev and mobile-discord-rebuild.diamond-lounge.pages.dev under Firebase Authentication → Settings → Authorized domains.",
            "auth/invalid-api-key": "The Firebase API key in firebase.js is invalid. Copy the Web app config from Firebase Console.",
            "auth/captcha-check-failed": "Phone verification CAPTCHA failed. Refresh and try again.",
            "auth/invalid-phone-number": "Enter your phone number in international format, such as +1 followed by your number.",
            "auth/quota-exceeded": "Firebase SMS quota is exhausted. Check Firebase Authentication phone settings.",
            "auth/invalid-verification-code": "That verification code is incorrect. Try again.",
            "auth/code-expired": "That verification code expired. Request a new one.",
            "auth/popup-blocked": "The Google sign-in popup was blocked. Allow popups for DIAMOND LOUNGE and try again.",
            "auth/popup-closed-by-user": "Google sign-in was closed before completion.",
            "auth/account-exists-with-different-credential": "An account already exists with this email using another sign-in method. Sign in with that method, then link Google from your profile."
        };

        async function ensureProfile(user) { const profileRef=doc(db,"users",user.uid); const existing=await getDoc(profileRef); if(!existing.exists()){ await setDoc(profileRef,{uid:user.uid,displayName:user.displayName || user.phoneNumber || "Member",createdAt:serverTimestamp()}); } }
guestButton.addEventListener("click",async()=>{guestButton.disabled=true;guestButton.textContent="Entering as Guest…";try{await signInAnonymously(auth);window.location.assign(postAuthDestination());}catch(e){errorMessage.textContent=errors[e.code]||e.message;guestButton.disabled=false;guestButton.textContent="Browse as Guest";}});
// iOS/mobile browsers use OAuth redirect instead of a popup to avoid popup/privacy failures.
const isMobileAuth = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.matchMedia("(max-width: 900px)").matches;
if(isMobileAuth){getRedirectResult(auth).then(async result=>{if(result?.user){await ensureProfile(result.user);window.location.assign(postAuthDestination());}}).catch(e=>{errorMessage.textContent=errors[e.code]||e.message;});}
googleButton.addEventListener("click", async()=>{googleButton.disabled=true;googleButton.textContent="Connecting to Google…";try{const provider=new GoogleAuthProvider();if(isMobileAuth){await signInWithRedirect(auth,provider);return;}const result=await signInWithPopup(auth,provider);await ensureProfile(result.user);window.location.assign(postAuthDestination());}catch(e){errorMessage.textContent=errors[e.code]||e.message;googleButton.disabled=false;googleButton.textContent="Continue with Google";}});
let confirmationResult=null;
phoneButton.addEventListener("click",async()=>{try{const phone=document.getElementById("phoneNumber").value.trim();if(!phone){errorMessage.textContent="Enter your phone number including country code.";return;}if(!window.phoneRecaptcha)window.phoneRecaptcha=new RecaptchaVerifier(auth,"recaptcha-container",{size:"normal"});confirmationResult=await signInWithPhoneNumber(auth,phone,window.phoneRecaptcha);phoneCodeArea.hidden=false;phoneButton.disabled=true;phoneButton.textContent="Code sent";errorMessage.textContent="Verification SMS sent. Enter the code below.";}catch(e){errorMessage.textContent=errors[e.code]||e.message;phoneButton.disabled=false;if(window.phoneRecaptcha){window.phoneRecaptcha.clear();window.phoneRecaptcha=null;}}});
document.getElementById("verifyPhoneButton").addEventListener("click",async()=>{try{const result=await confirmationResult.confirm(document.getElementById("phoneCode").value.trim());await ensureProfile(result.user);window.location.assign(postAuthDestination());}catch(e){errorMessage.textContent=errors[e.code]||"Verification failed.";phoneButton.disabled=false;phoneButton.textContent="Send verification code"; }});
form.addEventListener("submit", async (event) => {
            event.preventDefault();
            if (!form.reportValidity()) return;
            errorMessage.textContent = "";
            button.disabled = true;
            button.textContent = "Signing in…";

            try {
                await signInWithEmailAndPassword(
                    auth,
                    document.getElementById("loginEmail").value.trim(),
                    document.getElementById("loginPassword").value
                );
                window.location.assign(postAuthDestination());
            } catch (error) {
                console.error("Login error:", error);
                errorMessage.textContent = errors[error.code] || `Sign in failed${error.code ? ` (${error.code})` : ". Check your connection and try again."}`;
                button.disabled = false;
                button.textContent = "Sign in";
            }
        });
    </script>
</body>
</html>
